<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 20px; background: white; font-family: 'Times New Roman', Times, serif; }
  .container { width: 950px; margin: 0 auto; text-align: center; border: 1px solid #ccc; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  h2 { margin-bottom: 20px; letter-spacing: 1px; font-size: 22px; }
  .caption { margin-top: 20px; font-weight: bold; font-size: 16px; }
</style>
</head>
<body>
<div class="container">
  <h2>LEVEL -2</h2>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" style="font-family: Arial, sans-serif;">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
      </marker>
    </defs>

    <!-- Role 3.1: Admin -->
    <ellipse cx="140" cy="140" rx="80" ry="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <line x1="65" y1="112" x2="215" y2="112" stroke="#000000" stroke-width="1.5"/>
    <text x="140" y="103" text-anchor="middle" font-size="14" font-weight="bold">3.1</text>
    <text x="140" y="145" text-anchor="middle" font-size="15" font-weight="bold">Admin</text>

    <!-- Admin Sub-Processes -->
    <ellipse cx="480" cy="70" rx="90" ry="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="480" y="75" text-anchor="middle" font-size="13" font-weight="bold">Add Roster</text>

    <ellipse cx="480" cy="140" rx="90" ry="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="480" y="145" text-anchor="middle" font-size="13" font-weight="bold">Add Equipment</text>

    <ellipse cx="480" cy="210" rx="90" ry="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="480" y="215" text-anchor="middle" font-size="13" font-weight="bold">Tournament</text>

    <!-- Data Store 1 -->
    <g>
      <rect x="700" y="110" width="170" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <line x1="870" y1="110" x2="870" y2="170" stroke="#ffffff" stroke-width="4"/>
      <line x1="725" y1="110" x2="725" y2="170" stroke="#000000" stroke-width="2"/>
      <text x="798" y="145" text-anchor="middle" font-size="15" font-weight="bold">Data store</text>
    </g>

    <!-- Admin Connectors -->
    <line x1="215" y1="125" x2="388" y2="78" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="220" y1="140" x2="388" y2="140" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="215" y1="155" x2="388" y2="202" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>

    <line x1="570" y1="75" x2="698" y2="120" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="570" y1="140" x2="698" y2="140" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="570" y1="205" x2="698" y2="160" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Role 2.1: Login process -->
    <ellipse cx="140" cy="380" rx="80" ry="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <line x1="65" y1="352" x2="215" y2="352" stroke="#000000" stroke-width="1.5"/>
    <text x="140" y="343" text-anchor="middle" font-size="14" font-weight="bold">2.1</text>
    <text x="140" y="375" text-anchor="middle" font-size="14" font-weight="bold">Login</text>
    <text x="140" y="395" text-anchor="middle" font-size="14" font-weight="bold">process</text>

    <!-- Role 4.1: Donor / Student -->
    <ellipse cx="360" cy="380" rx="80" ry="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <line x1="285" y1="352" x2="435" y2="352" stroke="#000000" stroke-width="1.5"/>
    <text x="360" y="343" text-anchor="middle" font-size="14" font-weight="bold">4.1</text>
    <text x="360" y="385" text-anchor="middle" font-size="15" font-weight="bold">Student</text>

    <!-- Student Sub-Processes -->
    <ellipse cx="590" cy="340" rx="100" ry="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="590" y="345" text-anchor="middle" font-size="13" font-weight="bold">Sent Request</text>

    <ellipse cx="590" cy="420" rx="100" ry="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="590" y="425" text-anchor="middle" font-size="13" font-weight="bold">Check Request Status</text>

    <!-- Data Store 2 -->
    <g>
      <rect x="730" y="360" width="160" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <line x1="890" y1="360" x2="890" y2="420" stroke="#ffffff" stroke-width="4"/>
      <line x1="755" y1="360" x2="755" y2="420" stroke="#000000" stroke-width="2"/>
      <text x="822" y="395" text-anchor="middle" font-size="15" font-weight="bold">Data store</text>
    </g>

    <!-- Student Connectors -->
    <line x1="220" y1="380" x2="278" y2="380" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="435" y1="365" x2="488" y2="348" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="430" y1="395" x2="488" y2="415" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="690" y1="345" x2="728" y2="375" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Role 5.1: volunteer -->
    <ellipse cx="140" cy="620" rx="80" ry="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <line x1="65" y1="592" x2="215" y2="592" stroke="#000000" stroke-width="1.5"/>
    <text x="140" y="583" text-anchor="middle" font-size="14" font-weight="bold">5.1</text>
    <text x="140" y="625" text-anchor="middle" font-size="15" font-weight="bold">Volunteer / Coach</text>

    <!-- Coach Sub-Processes -->
    <ellipse cx="480" cy="580" rx="100" ry="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="480" y="585" text-anchor="middle" font-size="13" font-weight="bold">Sent service Request</text>

    <ellipse cx="480" cy="660" rx="100" ry="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="480" y="665" text-anchor="middle" font-size="13" font-weight="bold">Check the service status</text>

    <!-- Data Store 3 -->
    <g>
      <rect x="700" y="595" width="170" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <line x1="870" y1="595" x2="870" y2="655" stroke="#ffffff" stroke-width="4"/>
      <line x1="725" y1="595" x2="725" y2="655" stroke="#000000" stroke-width="2"/>
      <text x="798" y="630" text-anchor="middle" font-size="15" font-weight="bold">Data store</text>
    </g>

    <!-- Vertical Connectors between Roles -->
    <line x1="140" y1="190" x2="140" y2="328" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="140" y1="430" x2="140" y2="568" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Coach Connectors -->
    <line x1="215" y1="605" x2="378" y2="588" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="210" y1="635" x2="378" y2="655" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="580" y1="585" x2="698" y2="615" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  </svg>
  <div class="caption">LEVEL -2</div>
</div>
</body>
</html>
