# Koyeb Deployment Configuration
# ====================================================
# GASC Idappadi Smart Sports Management System
# Free hosting - Never sleeps!
# ====================================================
# NOTE: Set actual values in Koyeb dashboard → Environment Variables
# Do NOT put real secrets here.

name: gasc-sports

services:
  - name: gasc-sports-api
    type: web
    git:
      repository: lokeshkrishnan147-star/gasc-idappadi-sports
      branch: main
    run: node server/server.js
    ports:
      - port: 5000
        protocol: http
    env:
      - key: NODE_ENV
        value: production
      - key: COLLEGE_NAME
        value: Government Arts and Science College, Idappadi
    regions:
      - sin
    scaling:
      min: 1
      max: 1
    health_checks:
      - path: /api/health
        port: 5000
