<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 20px; background: white; font-family: 'Times New Roman', Times, serif; }
  .container { width: 900px; margin: 0 auto; text-align: center; border: 1px solid #ccc; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  h2 { margin-bottom: 20px; letter-spacing: 1px; font-size: 22px; }
  .caption { margin-top: 20px; font-weight: bold; font-size: 16px; }
</style>
</head>
<body>
<div class="container">
  <h2>LEVEL -0</h2>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260" style="font-family: Arial, sans-serif;">
    <!-- Entity 1: Student / Admin -->
    <rect x="30" y="90" width="180" height="70" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="120" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Student / Admin</text>
    
    <!-- Central Process: Smart Sports Management System -->
    <ellipse cx="425" cy="125" rx="140" ry="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="425" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Smart Sports</text>
    <text x="425" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Management System</text>
    
    <!-- Entity 2: Database -->
    <rect x="640" y="90" width="180" height="70" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="730" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Database</text>
    
    <!-- Arrows Left to Center -->
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
      </marker>
    </defs>

    <line x1="210" y1="110" x2="280" y2="110" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="245" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">User Input Data</text>

    <line x1="282" y1="140" x2="212" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="247" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Response / Info</text>

    <!-- Arrows Center to Right -->
    <line x1="565" y1="110" x2="635" y2="110" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="600" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Store Records</text>

    <line x1="637" y1="140" x2="567" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="602" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Fetch Query Data</text>
  </svg>
  <div class="caption">Figure 7.1 Level -0</div>
</div>
</body>
</html>
